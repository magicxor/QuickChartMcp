# On every semver tag (2.0.0 or a pre-release like 2.0.0-rc.1, no v prefix),
# publishes the framework-dependent (arch- and OS-neutral IL) QuickChartMcp build
# as tar.gz/zip assets on a GitHub Release, so consumers can pin a version and
# run it with `dotnet QuickChartMcp.dll` (the published output includes
# appsettings.json; point it at a QuickChart instance via the QuickChart__* env vars).
#
# There is deliberately NO container image: QuickChartMcp is a fully local stdio
# MCP server spawned by an MCP client, not a self-sufficient network service.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release-assets:
    name: Publish release assets
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish QuickChartMcp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish QuickChartMcp/QuickChartMcp.csproj \
            -c Release -o publish /p:UseAppHost=false /p:Version="$VERSION"

      - name: Pack assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "QuickChartMcp-$VERSION.tar.gz" -C publish .
          (cd publish && zip -qr "../QuickChartMcp-$VERSION.zip" .)
          sha256sum "QuickChartMcp-$VERSION.tar.gz" "QuickChartMcp-$VERSION.zip" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            QuickChartMcp-*.tar.gz
            QuickChartMcp-*.zip
            checksums.txt
