name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build QuickChartMcp.slnx -c Release

      - name: Test
        run: dotnet test QuickChartMcp.slnx -c Release --no-build
